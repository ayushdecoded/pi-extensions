version: 1
defaults:
  maxDepth: 2
  concurrency: 10
  timeoutMinutes: 10
  image: opencode-go/qwen3.7-plus
  imagePrompt: agents/vision.md
default_preset: deep
roles:
  Atlas:
    description: >-
      Read-only codebase and web researcher. Use for focused fact-finding; provide the question,
      relevant context, and expected evidence. Not for opinions, recommendations, plans, or implementation.
    model: opencode-go/deepseek-v4-flash
    thinking: high
    prompt: agents/atlas.md
    tools: [read, bash, web_search]
    delegates: []
    skills: []
    timeoutMinutes: 10
  Forge:
    description: >-
      Implementation agent for approved, bounded changes. Provide the goal, relevant context, file or symbol
      ownership, acceptance criteria, and stop condition. Not for design, research, review, or overlapping work.
    model: opencode-go/deepseek-v4-flash
    thinking: high
    prompt: agents/forge.md
    tools: [read, bash, edit, write]
    delegates: []
    skills: []
    timeoutMinutes: 20
  Vigil:
    description: >-
      Adversarial advisor for consequential architecture, designs, and implementation milestones. Use when
      independent judgment could materially affect a decision or expose a meaningful risk; provide goals,
      non-goals, constraints, decision rationale, options under consideration, review scope, and relevant code.
      Not for routine checks or confirmation of completed work.
    model: openai-codex/gpt-5.6-sol
    thinking: high
    prompt: agents/vigil.md
    tools: [read, bash]
    delegates: [Atlas]
    skills: []
    timeoutMinutes: 20
presets:
  light:
    roles: [Atlas, Forge, Vigil]
    Atlas:
      model: opencode-go/deepseek-v4-flash
      thinking: high
    Forge:
      model: opencode-go/deepseek-v4-flash
      thinking: high
    Vigil:
      model: opencode-go/deepseek-v4-flash
      thinking: max
  deep:
    roles: [Atlas, Forge, Vigil]
    Atlas:
      model: opencode-go/deepseek-v4-flash
      thinking: high
    Forge:
      model: opencode-go/deepseek-v4-flash
      thinking: high
    Vigil:
      model: openai-codex/gpt-5.6-sol
      thinking: high
